<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />

  <!-- Content -->
  <text x="50%" y="45%" font-family="Arial, sans-serif" font-size="80" fill="white" text-anchor="middle" font-weight="bold">MyHelloWorld</text>
  <text x="50%" y="60%" font-family="Arial, sans-serif" font-size="30" fill="white" text-anchor="middle">Simple Clock • Fun Emoji Effects</text>

  <!-- Emojis (simplified vector representations or text) -->
  <text x="20%" y="50%" font-size="100">⏰</text>
  <text x="80%" y="50%" font-size="100">✨</text>
  <text x="30%" y="80%" font-size="60">🎉</text>
  <text x="70%" y="80%" font-size="60">🥳</text>
  <text x="50%" y="90%" font-size="40">👋 Hello World!</text>
</svg>
